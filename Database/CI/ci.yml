name: IMS .NET 10 CI

on:
push:
branches:
- main
- feature/github-actions-ci

pull_request:
branches:
- main

jobs:
build-and-test:
runs-on: ubuntu-latest

```
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
    ports:
      - 1433:1433
    options: >-
      --health-cmd "/opt/mssql-tools18/bin/sqlcmd
      -S localhost
      -U sa
      -P $${MSSQL_SA_PASSWORD}
      -C
      -Q 'SELECT 1'"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 20
      --health-start-period 20s

steps:
  - name: Checkout source code
    uses: actions/checkout@v4

  - name: Setup .NET 10
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '10.0.x'

  - name: Display .NET version
    run: dotnet --info
